<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/virtual-labs/virtual-style@0.0.8-b/css/style.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <title>CLT Demonstration</title>
</head>

<body>

    <div class="container">
        <div class="columns is-centered">
            <div class="column is-full">
                <h2 class="tasks-heading">Tasks</h2>
            </div>
        </div>
        <div class="columns is-centered">
            <div class="column">
                <div class="v-tabs">
                    <ul>
                        <li onclick="window.location.href = 'illustration-clt.html';">
                            <a>Sub Experiment - 1</a>
                        </li>
                        <li class="is-active" onclick="window.location.href = 'application-clt.html';">
                            <a>Sub Experiment - 2</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="subheading-box">
            <h3 class="title">Visualizing the Central Limit Theorem</h3>
        </div>
    </div>

    <section id="page1">
        <div class="columns is-centered">
            <div class="column is-8-desktop is-9-tablet">
                <div class="white-boxed-panel">
                    <!-- Top Controls -->
                    <div class="election-top-controls">
                        <div class="control-item slider-container">
                            <label for="sampleSize">Sample Size (n): <span id="sampleSizeValue">100</span></label>
                            <input type="range" id="sampleSize" min="10" max="500" value="100">
                        </div>
                        <div class="control-item button-group">
                            <button class="option-btn" id="drawOneSample">Draw 1 Sample</button>
                            <button class="option-btn" id="drawHundredSamples">Draw 100 Samples</button>
                            <button class="option-btn reset-btn" id="resetSimulation">Reset</button>
                        </div>
                    </div>

                    <!-- Main Content: Charts -->
                    <div class="election-main-content">
                        <div class="chart-column-small">
                            <div class="chart-wrapper small">
                                <canvas id="populationChart"></canvas>
                            </div>
                            <div class="chart-wrapper small">
                                <canvas id="lastSampleChart"></canvas>
                            </div>
                        </div>
                        <div class="chart-column-large">
                             <div class="chart-wrapper large">
                                <canvas id="samplingDistChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="column is-3-desktop is-12-tablet">
                <div class="v-datalist-container components-list">
                    <div class="v-datalist-title">Observations & Statistics</div>
                    <div id="stats-display">
                        <p><strong>True Population Proportion (Cand. 1):</strong> <span id="true-mean">0.00</span></p>
                        <hr>
                        <p><strong>Samples Drawn:</strong> <span id="num-samples">0</span></p>
                        <p><strong>Mean of Sample Proportions:</strong> <span id="mean-of-means">N/A</span></p>
                        <p><strong>Standard Error (from samples):</strong> <span id="se-of-means">N/A</span></p>
                        <p><strong>Theoretical Standard Error:</strong> <span id="theoretical-se">N/A</span></p>
                    </div>
					<p id="observations" style="font-size: 1em; margin-top: 15px;"></p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/gh/virtual-labs/virtual-style@0.0.8-b/js/script.js"></script>
    <script src="./js/application-clt.js"></script>

</body>
</html>
